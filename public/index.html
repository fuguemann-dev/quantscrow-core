<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantscrow Core | Terminal</title>
    <style>
        :root { --bg-dark: #090909; --bg-card: #141414; --gold-1: #d4af37; --gold-light: #f3e5ab; --gold-dark: #aa8c2c; --text-main: #e0e0e0; --text-muted: #888; --success: #4caf50; --danger: #f44336; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; }
        .header { text-align: center; border-bottom: 2px solid var(--gold-dark); padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: var(--gold-1); letter-spacing: 3px; margin: 0; }
        .status-bar { display: flex; justify-content: space-between; font-size: 0.8em; color: var(--gold-dark); margin-top: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { border: 1px solid #333; padding: 20px; border-radius: 8px; background: var(--bg-card); box-shadow: 0 0 15px rgba(212, 175, 55, 0.05); }
        .panel h3 { margin-top: 0; color: var(--gold-light); font-size: 1em; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8em; color: var(--text-muted); margin-bottom: 5px; }
        input { width: 100%; background: #000; border: 1px solid #333; color: var(--gold-1); padding: 10px; box-sizing: border-box; font-family: inherit; }
        input:focus { outline: none; border-color: var(--gold-1); }
        button { width: 100%; padding: 15px; background: var(--gold-1); color: #000; border: none; font-weight: bold; font-size: 1em; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: var(--gold-light); }
        .btn-connect { background: #333; color: var(--gold-1); border: 1px solid var(--gold-1); }
        .btn-connect:hover { background: var(--gold-1); color: #000; }
        #resultado { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; text-align: center; font-weight: bold; font-size: 0.9em; }
        .exito { background: rgba(76, 175, 80, 0.2); border: 1px solid var(--success); color: var(--success); }
        .error { background: rgba(244, 67, 54, 0.2); border: 1px solid var(--danger); color: var(--danger); }
        .info-box { font-size: 0.75em; color: var(--text-muted); margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>QUANTSCROW CORE</h1>
        <div class="status-bar">
            <span id="server-loc">CONECTANDO...</span>
            <span id="server-time">--:--:--</span>
            <span id="server-db">DB: ---</span>
        </div>
    </div>

    <div class="grid">
        <!-- PANEL IZQUIERDO: CONEXIÓN AL BRÓKER -->
        <div class="panel">
            <h3>🔗 CONEXIÓN METAAPI</h3>
            <div class="input-group">
                <label>MetaAPI Token</label>
                <input type="password" id="metaToken" placeholder="eyJhbGciOiJSUzI1NiIs...">
            </div>
            <div class="input-group">
                <label>Account ID</label>
                <input type="text" id="metaAccountId" placeholder="12345678-abcd-...">
            </div>
            <button class="btn-connect" onclick="conectarBroker()">VERIFICAR CONEXIÓN</button>
            <div class="info-box">
                *Esta conexión es segura. Las llaves no se guardan en el navegador, se envían al servidor en Atlanta.
            </div>
            <div id="statusBroker" style="margin-top: 15px; font-size: 0.9em; text-align: center;">Estado: Desconectado</div>
        </div>

        <!-- PANEL DERECHO: EJECUCIÓN CUANTITATIVA -->
        <div class="panel">
            <h3>⚙️ EJECUCIÓN CUANTITATIVA</h3>
            <div class="input-group">
                <label>Par (Ej: EURUSD)</label>
                <input type="text" id="par" value="EURUSD">
            </div>
            <div class="input-group">
                <label>Prob. Base (0 a 1)</label>
                <input type="number" id="probBase" value="0.48" step="0.01" min="0" max="1">
            </div>
            <div class="input-group">
                <label>ATR Actual</label>
                <input type="number" id="atr" value="0.00120" step="0.00001">
            </div>
            <div class="input-group">
                <label>Balance Base (USD)</label>
                <input type="number" id="balance" value="10000">
            </div>
            <button onclick="evaluarTrade()">EJECUTAR ANÁLISIS CUANTITATIVO</button>
        </div>
    </div>
    
    <div id="resultado"></div>
</div>

<script>
    // Actualizar barra de estado superior
    setInterval(async () => {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('server-loc').innerText = `CLÚSTER: ${data.server} (${data.status})`;
            document.getElementById('server-time').innerText = `HORA EST: ${data.time_est.split(', ')[1]}`;
            document.getElementById('server-db').innerText = `DB: ${data.db}`;
        } catch (e) {
            document.getElementById('server-loc').innerText = "CLÚSTER: OFFLINE";
        }
    }, 5000);

    // Conexión Real a MetaAPI (Llama al backend)
    async function conectarBroker() {
        const token = document.getElementById('metaToken').value;
        const accountId = document.getElementById('metaAccountId').value;
        const statusDiv = document.getElementById('statusBroker');

        if(!token || !accountId) {
            statusDiv.innerHTML = "⚠️ Faltan credenciales.";
            statusDiv.style.color = "var(--danger)";
            return;
        }

        statusDiv.innerHTML = "⏳ Conectando con MetaAPI...";
        statusDiv.style.color = "var(--gold-1)";

        try {
            const res = await fetch('/api/connect-metaapi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, accountId })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                statusDiv.innerHTML = `✅ ${data.mensaje}`;
                statusDiv.style.color = "var(--success)";
            } else {
                statusDiv.innerHTML = `❌ Error: ${data.error}`;
                statusDiv.style.color = "var(--danger)";
            }
        } catch (e) {
            statusDiv.innerHTML = "❌ Error de red con el servidor.";
            statusDiv.style.color = "var(--danger)";
        }
    }

    // Función principal de evaluación
    async function evaluarTrade() {
        const btn = document.querySelector('button[onclick="evaluarTrade()"]');
        const resDiv = document.getElementById('resultado');
        btn.innerText = "PROCESANDO..."; resDiv.style.display = 'none';

        const payload = {
            par: document.getElementById('par').value,
            probBase: parseFloat(document.getElementById('probBase').value),
            atr: parseFloat(document.getElementById('atr').value),
            balance: parseFloat(document.getElementById('balance').value)
        };

        try {
            const response = await fetch('/api/evaluar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            resDiv.style.display = 'block';
            
            if (response.ok) {
                resDiv.className = 'exito';
                resDiv.innerHTML = `
                    <h3 style="margin:0 0 10px 0;">✅ ${data.mensaje}</h3>
                    <p>Lote Calculado: <strong>${data.detalles.lote}</strong></p>
                    <p>Probabilidad: <strong>${data.detalles.probabilidad}</strong></p>
                    <p>EV: <strong>${data.detalles.expectedValue}</strong></p>
                `;
            } else {
                resDiv.className = 'error';
                resDiv.innerHTML = `🚫 ${data.error}`;
            }
        } catch (error) {
            resDiv.style.display = 'block'; resDiv.className = 'error';
            resDiv.innerHTML = `🚨 Error de conexión con el motor.`;
        } finally {
            btn.innerText = "EJECUTAR ANÁLISIS CUANTITATIVO";
        }
    }
</script>
</body>
</html>
